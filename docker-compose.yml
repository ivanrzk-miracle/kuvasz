services:
  kuvasz-db:
    image: postgres:18-alpine
    container_name: kuvaszdb
    environment:
      POSTGRES_USER: miracle
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: 'UTC-3'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miracle"]
      interval: 10s
      start_period: 30s
    volumes:
      - kuvasz-db-data:/var/lib/postgresql
  kuvasz:
    image: kuvaszmonitoring/kuvasz:latest
    # platform: linux/arm64 #
    container_name: kuvasz
    ports:
      - "8080:8080"
    environment:
      TZ: 'UTC-3'
      DATABASE_HOST: kuvaszdb
      DATABASE_USER: miracle
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    volumes:
      - ./kuvasz.yml:/config/kuvasz.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/v2/health || exit 1"]
      interval: 60s
      start_period: 30s
    depends_on:
      - kuvasz-db
volumes:
  kuvasz-db-data: